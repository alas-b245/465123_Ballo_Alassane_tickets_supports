[project]
name = "support-tickets-lab"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi==0.115.12",
  "httpx==0.28.1",
  "requests==2.32.3",
  "uvicorn[standard]==0.34.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.3.5",
  "pytest-asyncio==0.26.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "acceptance: пользовательские сценарии лабораторной",
  "integration: взаимодействие между сервисами",
]
