upstream tickets_backend {
    # Intentional lab defect: Tickets API listens on another container port.
    server tickets-api:8001;
}

upstream frontend_app {
    server frontend:80;
}

server {
    listen 80;

    location /api/ {
        proxy_pass http://tickets_backend;
        proxy_set_header Host $host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Idempotency-Key $http_idempotency_key;
    }

    location / {
        proxy_pass http://frontend_app;
        proxy_set_header Host $host;
    }
}

