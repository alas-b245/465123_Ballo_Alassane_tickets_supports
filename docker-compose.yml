services:
  frontend:
    build: ./frontend
    depends_on:
      - tickets-api

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
      - tickets-api

  tickets-api:
    build:
      context: .
      dockerfile: tickets-api/Dockerfile
    environment:
      EVENT_SERVICE_URL: http://event-service:8000
      CLASSIFICATION_SERVICE_URL: http://slow-classification-service:8000
    ports:
      - "8000:8000"
    depends_on:
      - event-service
      - slow-classification-service

  event-service:
    build:
      context: .
      dockerfile: event-service/Dockerfile
    ports:
      - "8001:8000"

  slow-classification-service:
    build:
      context: .
      dockerfile: slow-classification-service/Dockerfile
    environment:
      CLASSIFICATION_DELAY_SECONDS: "20"
    ports:
      - "8002:8000"

